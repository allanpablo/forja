name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # O job `test` roda o código-FONTE (.ts desde SPEC-012 Fase 2), com strip-types nativo
        # (Node ≥22.6). O pacote PUBLICADO (dist/*.js, engines >=22) é provado pelo job
        # `release-gate`, que instala o tarball e percorre a jornada do usuário nele (ADR-0086).
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Type-check (checkJs on-ramp, SPEC-012 Fase 1)
        run: npm run types:check
      - run: npm test
      - name: Core smoke test
        run: |
          node bin/forja.ts
          node bin/forja.ts spec:check forja-core

      # O gate do núcleo (ADR-0023) existia e nada o executava automaticamente. Roda na matriz
      # inteira de propósito: o check `native-abi` só tem sentido contra várias versões do Node.
      - name: Doctor do núcleo
        run: node bin/forja.ts tools:doctor

  # O gate do tarball (ADR-0024). Job separado e sem matriz: o custo aqui é o `npm install`
  # compilando o better-sqlite3 do zero, e instalar três vezes não prova mais que instalar uma.
  #
  # Este job é a evidência do release — a prova de que uma instalação limpa funciona passa a viver
  # no log do CI, e não na memória de quem publicou.
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Gate do tarball (instalação limpa)
        run: node bin/forja.ts release:check
      # Gate do projeto gerado (ADR-0029), tier barato: gera um projeto isolado e prova que é
      # coerente (sem placeholder vazado, package.json válido, estrutura íntegra). Sem rede — o
      # tier --full (npm install + build) é opt-in, pré-release.
      - name: Gate do projeto gerado
        run: node bin/forja.ts project:smoke

  # SPEC-047: o caminho real do usuário — `--ai <lista>`, que escreve as instruções nativas por IA
  # — só era exercitado à mão. Aqui roda numa matriz pequena, tier barato (memória + instruções,
  # sem `npm install`): um PR que quebra o gerador multi-IA fica vermelho antes do merge.
  project-smoke-ai:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ai:
          - claude
          - copilot
          - claude,copilot,gemini,codex
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Smoke do projeto gerado (--ai ${{ matrix.ai }})
        run: node bin/forja.ts project:smoke --ai ${{ matrix.ai }}

  # O projeto gerado RODA o que anuncia (ADR-0088): instala, compila, testes e lint — para o backend
  # padrão e para cada template validado. `test/templates.test.js` exige que todo boilerplate com
  # "template": true esteja nesta matriz.
  project-smoke-full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - default
          - clean-arch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Smoke completo (${{ matrix.template }})
        run: |
          if [ "${{ matrix.template }}" = default ]; then
            node bin/forja.ts project:smoke --full
          else
            node bin/forja.ts project:smoke --full --template ${{ matrix.template }}
          fi
